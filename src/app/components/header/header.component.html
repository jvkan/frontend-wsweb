<nav class="navbar navbar-dark bg-dark shadow">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <!-- Logo -->
    <a class="navbar-brand fw-bold text-danger" routerLink="/">WL web</a>

    <!-- Navigation -->
    <ul class="navbar-nav flex-row gap-3 align-items-center">
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/">
          <fa-icon [icon]="faHome" class="me-1"></fa-icon> Home
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/items">
          <fa-icon [icon]="faStore" class="me-1"></fa-icon> Shop
        </a>
      </li>

      <ng-container *ngIf="!isLoggedIn(); else loggedIn">
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/register">
            <fa-icon [icon]="faUserPlus" class="me-1"></fa-icon> Sign Up
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/login">
            <fa-icon [icon]="faSignInAlt" class="me-1"></fa-icon> Login
          </a>
        </li>
      </ng-container>

      <ng-template #loggedIn>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/profile">
            <fa-icon [icon]="faUser" class="me-1"></fa-icon> Profile
          </a>
        </li>
        <li class="nav-item">
          <button class="btn btn-link nav-link text-white p-0" (click)="logout()">
            <fa-icon [icon]="faSignOutAlt" class="me-1"></fa-icon> Logout
          </button>
        </li>
      </ng-template>
    </ul>
  </div>
</nav>
