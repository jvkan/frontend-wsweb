<div class="container mt-4">
  <h2>Login</h2>
  <form (ngSubmit)="onSubmit()">
    <input [(ngModel)]="username" name="username" placeholder="Username" required class="form-control" />
    <input [(ngModel)]="password" name="password" placeholder="Password" type="password" required class="form-control my-2" />
    <button class="btn btn-primary">Login</button>
    <div *ngIf="error" class="text-danger mt-2">{{ error }}</div>
  </form>
</div>
